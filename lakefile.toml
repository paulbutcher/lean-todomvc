name = "todomvc"
version = "0.1.0"
defaultTargets = ["TodoMVC", "Todo"]
testDriver = "TodoTests"

[[require]]
name = "leansqlite"
git = "https://github.com/leanprover/leansqlite"
rev = "v4.34.0"

[[require]]
name = "html-renderer"
git = "https://github.com/paulbutcher/lean-html-renderer"
rev = "v0.1.0"

[[require]]
name = "html-syntax"
git = "https://github.com/paulbutcher/lean-html-syntax"
rev = "v0.1.0"

[[require]]
name = "routing-std"
git = "https://github.com/paulbutcher/lean-routing"
subDir = "std"
rev = "v0.15.2"

[[require]]
name = "middleware"
git = "https://github.com/paulbutcher/lean-middleware"
rev = "v0.20.1"

[[lean_lib]]
name = "Todo"

[[lean_lib]]
name = "TodoTests"

[[lean_exe]]
name = "TodoMVC"
root = "Main"
